<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile – Contrôle d'inventaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A6B}a:hover{color:#08404C}
.lbl{font-size:14px;font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #C9CFC9;border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
.opt.on{border:2px solid #0E5A6B;background:#E3EFF1;color:#0E5A6B;font-weight:600}
.opt input{position:absolute;opacity:0;pointer-events:none}
select,textarea{width:100%;box-sizing:border-box;border:1px solid #C9CFC9;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:#17262B}
select{min-height:48px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; font-family: 'IBM Plex Sans', sans-serif; color: #17262B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 16px 12px; display: flex; align-items: center; gap: 12px">
    <a href="MobileFiche.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDE1DC; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17262B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div><div style="font-size: 17px; font-weight: 600">Contrôle du bien</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5A676B">UIYA-INF-2024-0142 · Dell Latitude</div></div>
  </header>
  <form style="flex: 1; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend class="lbl">Le bien est-il présent ?</legend>
      <div class="opts" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
        <label class="opt on"><input type="radio" name="pres" checked>Oui, présent</label>
        <label class="opt"><input type="radio" name="pres">Non, absent</label>
      </div>
    </fieldset>
    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend class="lbl">État constaté</legend>
      <div class="opts">
        <label class="opt on"><input type="radio" name="etat" checked>Bon</label>
        <label class="opt"><input type="radio" name="etat">Moyen</label>
        <label class="opt"><input type="radio" name="etat">Dégradé</label>
      </div>
    </fieldset>
    <div>
      <label class="lbl" for="salle" style="display: block">Salle où il se trouve</label>
      <select id="salle"><option>B05 – salle prévue</option><option>B04</option><option>B06</option><option>Autre salle…</option></select>
    </div>
    <div>
      <label class="lbl" for="obs" style="display: block">Observation</label>
      <textarea id="obs" rows="3" placeholder="Facultatif"></textarea>
    </div>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #9FB0AB; border-radius: 10px; background: #fff; font: inherit; font-size: 15px; color: #0E5A6B; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E5A6B" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><circle cx="12" cy="12.5" r="3.2"></circle><path d="M9 6l1.5-2h3L15 6"></path></svg>
      Ajouter une photo
    </button>
  </form>
  <div style="padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8A510A"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C47A1C"></span>Hors ligne : le contrôle sera synchronisé plus tard</div>
    <a href="MobileScanner.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 12px; background: #0E5A6B; color: #fff; text-decoration: none; font-size: 16px; font-weight: 600">Valider et scanner le suivant</a>
  </div>
</div>
</body>
</html>
