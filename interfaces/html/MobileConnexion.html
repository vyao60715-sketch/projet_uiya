<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile – Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A6B}a:hover{color:#08404C}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input{width:100%;box-sizing:border-box;min-height:50px;border:1px solid #C9CFC9;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#17262B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #17262B; font-family: 'IBM Plex Sans', sans-serif; color: #17262B; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 72px 28px 36px; color: #fff; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 52px; height: 52px; border-radius: 12px; background: #0E5A6B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px">U</div>
    <div>
      <div style="font-size: 28px; font-weight: 600; line-height: 1.2">UIYA · Patrimoine</div>
      <div style="font-size: 15px; color: #B8C3C0; margin-top: 6px">Scan, inventaire et signalements sur le terrain</div>
    </div>
  </div>
  <form style="flex: 1; background: #F4F5F2; border-radius: 22px 22px 0 0; padding: 32px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="font-size: 22px; font-weight: 600">Connexion</div>
    <div class="field"><label for="m-email">Adresse e-mail</label><input id="m-email" type="email" placeholder="prenom.nom@uiya.ci"></div>
    <div class="field"><label for="m-mdp">Mot de passe</label><input id="m-mdp" type="password" value="motdepasse"></div>
    <a href="#" style="font-size: 14px; align-self: flex-end">Mot de passe oublié ?</a>
    <a href="MobileAccueil.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: #0E5A6B; color: #fff; text-decoration: none; font-weight: 500; font-size: 16px; margin-top: 6px">Se connecter</a>
    <div style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #3D4A4E; background: #E3EFF1; border-radius: 10px; padding: 12px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5A6B" stroke-width="1.8" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span>Connectez-vous une première fois avec du réseau. Vous pourrez ensuite travailler hors ligne pendant les inventaires.</span>
    </div>
  </form>
</div>
</body>
</html>
